[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-tournament"
version = "0.3.0a1"
description = "Three-agent patch comparison with independent grading and factual diff guards"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Patch Tournament contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/majiayu000/patch-tournament"
Repository = "https://github.com/majiayu000/patch-tournament"
Issues = "https://github.com/majiayu000/patch-tournament/issues"

[project.scripts]
patch-tournament = "patch_tournament.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
